<!doctype html>
<html lang="en">
  <head>
    <!-- Basic -->
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />

    <!-- Title -->
    <title>Menu</title>

    <!-- SEO -->
    <meta
      name="description"
      content="Browse our delicious menu, featured dishes, and latest food offerings."
    />
    <meta
      name="keywords"
      content="restaurant menu, food menu, online ordering, dishes, restaurant"
    />
    <meta name="author" content="Your Restaurant Name" />
    <meta name="robots" content="index, follow" />

    <!-- Theme -->
    <meta name="theme-color" content="#ffffff" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Menu" />
    <meta
      property="og:description"
      content="Browse our delicious menu and featured dishes."
    />
    <meta property="og:image" content="/preview.jpg" />
    <meta property="og:url" content="https://boracay.giuseppe.ph" />
    <meta property="og:url" content="https://iloilo.giuseppe.ph" />
    <meta property="og:url" content="https://iloilo.jardin.ph" />
    <meta property="og:site_name" content="Restaurant Menu" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Menu" />
    <meta
      name="twitter:description"
      content="Browse our delicious menu and featured dishes."
    />
    <meta name="twitter:image" content="/preview.jpg" />

    <!-- Mobile -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!-- Icons -->
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Canonical -->
    <link rel="canonical" href="https://boracay.giuseppe.ph" />
    <link rel="canonical" href="https://iloilo.giuseppe.ph" />
    <link rel="canonical" href="https://iloilo.jardin.ph" />

    <!-- Preconnect (Optional Performance) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- App -->
    <script type="module" src="/src/main.jsx"></script>
  </head>

  <body>
    <div id="root"></div>
  </body>
</html>
