server {
    listen 80;
    server_name iloilo.giuseppe.ph menu.local;

    root /var/www/menu_hub/dist;
    index index.html;

    location = /config.json {
        add_header Cache-Control "no-store";
        try_files /config.json =404;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Live server:
    #   proxy_pass https://dbx.d3.net/;
    #
    # Restaurant offline server:
    #   proxy_pass http://127.0.0.1:5984/;
    location /couch/ {
        proxy_pass http://127.0.0.1:5984/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Optional cleaner route if you want to hide CouchDB details from config.json:
    # location = /api/menu.json {
    #     proxy_pass http://127.0.0.1:5984/templates/menus%2Fmenu_v1;
    # }

    # Keep this exact route if menuDoc contains a slash; generic rewrites can
    # decode %2F before CouchDB sees the document id.
    location = /couch/templates/menus/menu_v1 {
        proxy_pass http://127.0.0.1:5984/templates/menus%2Fmenu_v1;
        add_header Cache-Control "no-store";
    }

    # Product images only. This keeps the public menu away from raw CouchDB
    # product documents while still allowing fresh image attachments.
    location ~ ^/images/products/([0-9]+)$ {
        proxy_pass http://127.0.0.1:5984/pos_pp_products/products/$1/image;
        add_header Cache-Control "no-store";
    }

    # Keep the old PHP/API path as a fallback during migration.
    location /api/ {
        proxy_pass https://pp.d3.net/;
    }

    location / {
        try_files $uri /index.html;
    }
}
