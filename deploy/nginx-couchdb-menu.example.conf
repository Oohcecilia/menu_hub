server {
    listen 80;
    server_name iloilo.giuseppe.ph menu.local;

    root /var/www/menu_hub/dist;
    index index.html;

    location = /config.json {
        add_header Cache-Control "no-store";
        try_files /config.json =404;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Live server:
    #   proxy_pass https://dbx.d3.net/;
    #
    # Restaurant offline server:
    #   proxy_pass http://127.0.0.1:5984/;
    location /couch/ {
        proxy_pass http://127.0.0.1:5984/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Optional cleaner route if you want to hide CouchDB details from config.json:
    # location = /api/menu.json {
    #     proxy_pass http://127.0.0.1:5984/menu_iloilo_giuseppe_ph/menu%3Acurrent;
    # }

    # Keep the old PHP/API path as a fallback during migration.
    location /api/ {
        proxy_pass https://pp.d3.net/;
    }

    location / {
        try_files $uri /index.html;
    }
}
